name: Deploy Mockup

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/deploy-mock.sh'
      - '.github/workflows/deploy-mock.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Simulate deploy pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_VERSION: '20'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Run Svelte checks
        working-directory: app
        run: npm run check

      - name: Simulate remote deploy
        env:
          LECREV_DRY_RUN: 1
          LECREV_DEPLOY_BRANCH: main
          LECREV_REMOTE_REPO_PATH: /opt/lecrev
          LECREV_REMOTE_APP_PATH: /opt/lecrev/app
          LECREV_PM2_PROCESS: lecrev-app
        run: |
          bash scripts/deploy-mock.sh

      - name: Summary
        run: |
          echo "Mock deploy completed. Set LECREV_DRY_RUN=0 and configure secrets to enable real deployments."
